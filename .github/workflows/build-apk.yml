# Membangun APK MathDeck di runner GitHub.
#
# Build Android butuh Android SDK dari dl.google.com. Runner ubuntu GitHub
# sudah membawanya, jadi tidak perlu memasang apa pun di komputer sendiri.
#
# Hasilnya diunggah sebagai artifact "mathdeck-apk" — unduh dari halaman
# Actions, bagian "Artifacts" di bawah ringkasan run.

name: Build APK

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

jobs:
  periksa:
    name: Periksa kode & konten
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa tipe
        run: npm run typecheck

      - name: Tes lib/srs.ts
        run: npm test

      - name: Validasi konten
        run: npm run validate-content

      # Berkas bangkitan ikut di-commit. Kalau hasil membangun ulang berbeda,
      # berarti ada yang lupa menjalankan generatornya setelah mengubah konten.
      - name: Pastikan berkas bangkitan tidak basi
        run: |
          npm run build-content-index
          npm run build-index
          npm run build-katex
          if ! git diff --quiet; then
            echo "Berkas bangkitan sudah basi. Jalankan perintah berikut lalu commit hasilnya:"
            echo "  npm run build-content-index && npm run build-index && npm run build-katex"
            git diff --stat
            exit 1
          fi
          echo "Berkas bangkitan sudah mutakhir."

  build:
    name: Rakit APK rilis
    needs: periksa
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm ci

      - name: Bangun proyek native Android
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Rakit APK rilis
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Laporkan ukuran APK
        run: |
          echo "### APK MathDeck" >> "$GITHUB_STEP_SUMMARY"
          for f in android/app/build/outputs/apk/release/*.apk; do
            size=$(du -h "$f" | cut -f1)
            echo "- \`$(basename "$f")\` — $size" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Unduh dari bagian **Artifacts** di bawah." >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: mathdeck-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
