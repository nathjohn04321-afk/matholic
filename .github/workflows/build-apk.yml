# Membangun APK MathDeck di runner GitHub.
#
# Build Android butuh Android SDK dari dl.google.com. Runner ubuntu GitHub
# sudah membawanya, jadi tidak perlu memasang apa pun di komputer sendiri.
#
# Hasilnya diunggah sebagai artifact "mathdeck-apk" — unduh dari halaman
# Actions, bagian "Artifacts" di bawah ringkasan run.

name: Build APK

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

# Beberapa push berurutan pada satu cabang menumpuk antrean: build terbaru
# harus menunggu build lama yang hasilnya sudah tidak dipakai. Hanya versi
# terakhir tiap cabang yang perlu dibangun, jadi yang lama dibatalkan.
# Cabang main dikecualikan supaya tiap commit di sana tetap punya APK-nya.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  periksa:
    name: Periksa kode & konten
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa tipe
        run: npm run typecheck

      - name: Tes lib/srs.ts
        run: npm test

      - name: Validasi konten
        run: npm run validate-content

      # Berkas bangkitan ikut di-commit. Kalau hasil membangun ulang berbeda,
      # berarti ada yang lupa menjalankan generatornya setelah mengubah konten.
      - name: Pastikan berkas bangkitan tidak basi
        run: |
          npm run build-content-index
          npm run build-index
          npm run build-katex
          if ! git diff --quiet; then
            echo "Berkas bangkitan sudah basi. Jalankan perintah berikut lalu commit hasilnya:"
            echo "  npm run build-content-index && npm run build-index && npm run build-katex"
            git diff --stat
            exit 1
          fi
          echo "Berkas bangkitan sudah mutakhir."

  build:
    name: Rakit APK rilis
    needs: periksa
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm ci

      - name: Bangun proyek native Android
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # APK bawaan memuat pustaka native untuk keempat arsitektur CPU
      # sekaligus, dan itu saja sudah 84 MB — dua di antaranya (x86 dan
      # x86_64) hanya dipakai emulator, tidak pernah oleh HP sungguhan.
      # Jadi dirakit per arsitektur. arm64-v8a mencakup hampir semua HP
      # Android sejak 2017; armeabi-v7a untuk perangkat 32-bit yang lebih tua.
      - name: Rakit APK arm64-v8a
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Simpan APK arm64-v8a
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/mathdeck.apk

      - name: Rakit APK armeabi-v7a
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a

      - name: Simpan APK armeabi-v7a
        run: cp android/app/build/outputs/apk/release/app-release.apk dist/mathdeck-armeabi-v7a.apk

      # SPEC.md bagian 13 membatasi APK di bawah 60 MB. Batas ini pernah
      # terlewat karena yang diperiksa adalah ukuran artifact zip, bukan
      # APK-nya, jadi sekarang diperiksa otomatis dan membuat build gagal.
      - name: Periksa batas ukuran APK
        run: |
          set -euo pipefail
          batas=60000000
          gagal=0
          echo "### APK MathDeck" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Berkas | Ukuran | Batas 60 MB |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|--:|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.apk; do
            bita=$(stat -c%s "$f")
            mb=$(awk "BEGIN {printf \"%.1f\", $bita/1000000}")
            if [ "$bita" -lt "$batas" ]; then
              status="lulus"
            else
              status="**GAGAL**"
              gagal=1
            fi
            echo "| \`$(basename "$f")\` | ${mb} MB | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$gagal" -ne 0 ]; then
            echo "Ada APK yang melewati batas 60 MB dari SPEC.md bagian 13." >&2
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Unduh dari bagian **Artifacts** di bawah, atau lewat Release \`apk-terbaru\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathdeck-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Artifact hanya bisa diunduh sebagai zip dan menuntut login GitHub.
      # Release memberi tautan .apk langsung yang bisa dibuka di HP tanpa login,
      # jadi APK yang sama diterbitkan juga ke sana. Tag-nya tetap, isinya
      # ditimpa tiap build, sehingga tautannya tidak pernah berubah.
      - name: Terbitkan APK ke Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/milestone-1-w8yh53'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag=apk-terbaru
          catatan="APK MathDeck, dirakit otomatis dari commit ${GITHUB_SHA}.

          Unduh \`mathdeck.apk\` di bawah, lalu pasang di HP Android.
          Perlu mengizinkan \"Instal aplikasi tidak dikenal\" untuk peramban
          atau pengelola berkas yang kamu pakai.

          Ditandatangani dengan kunci debug, jadi bisa langsung dipasang tanpa
          menyiapkan keystore. Untuk rilis ke Play Store, keystore sendiri
          wajib dibuat (caranya ada di README)."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "$catatan"
            gh release upload "$tag" dist/mathdeck.apk dist/mathdeck-armeabi-v7a.apk --clobber
          else
            gh release create "$tag" dist/mathdeck.apk dist/mathdeck-armeabi-v7a.apk \
              --title "MathDeck — APK terbaru" \
              --notes "$catatan" \
              --prerelease
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK juga terbit di Release: <https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}>" >> "$GITHUB_STEP_SUMMARY"
